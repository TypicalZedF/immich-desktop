# Flatpak for Linux. Built in CI (.github/workflows/flatpak.yml) from the app that build/publish.sh
# publishes, plus libmpv for video (the same build recipe as Flathub's Celluloid, without what an
# image viewer doesn't need). Build locally:
#   ./build/publish.sh 1.2.0
#   flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build-dir build/flatpak/io.github.TypicalZedF.ImmichDesktop.yaml
#   flatpak build-bundle repo ImmichDesktop.flatpak io.github.TypicalZedF.ImmichDesktop
id: io.github.TypicalZedF.ImmichDesktop
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: immich-desktop
finish-args:
  - --share=ipc
  - --share=network
  # Avalonia 11 draws through X11 (XWayland on Wayland desktops), with the graphics card.
  - --socket=x11
  - --device=dri
  # Video sound.
  - --socket=pulseaudio
  # Backs up the folders you choose, wherever they are in your home folder.
  - --filesystem=home
  # Start with your login (writes ~/.config/autostart).
  - --filesystem=xdg-config/autostart:create
  # Tray icon and desktop notifications.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-*
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=org.freedesktop.Notifications
  # Network status (metered connections, home network) from NetworkManager.
  - --system-talk-name=org.freedesktop.NetworkManager
modules:
  - name: libmpv
    buildsystem: meson
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share
    config-opts:
      - --libdir=lib
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dalsa=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Drubberband=disabled
      - -Duchardet=disabled
      - -Dlibarchive=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
    modules:
      - name: ffmpeg
        cleanup:
          - /include
          - /lib/pkgconfig
          - /share/ffmpeg/examples
        config-opts:
          - --enable-shared
          - --disable-static
          - --enable-gnutls
          - --enable-gpl
          - --disable-doc
          - --disable-programs
          - --disable-encoders
          - --disable-muxers
          - --enable-libdav1d
        sources:
          - type: archive
            url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
            sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e
      - name: libass
        cleanup:
          - /include
          - /lib/*.la
          - /lib/pkgconfig
        config-opts:
          - --disable-static
        sources:
          - type: archive
            url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
            sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
      - name: libplacebo
        buildsystem: meson
        config-opts:
          - --libdir=lib # meson would pick lib64, where nothing looks for it
        cleanup:
          - /include
          - /lib/pkgconfig
        sources:
          - type: git
            url: https://github.com/haasn/libplacebo.git
            tag: v7.360.1
            commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: immich-desktop
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/immich-desktop
      - cp -a app/. /app/lib/immich-desktop/
      - install -Dm755 immich-desktop.sh /app/bin/immich-desktop
      - install -Dm644 logo-512.png /app/share/icons/hicolor/512x512/apps/io.github.TypicalZedF.ImmichDesktop.png
      - install -Dm644 logo-256.png /app/share/icons/hicolor/256x256/apps/io.github.TypicalZedF.ImmichDesktop.png
      - install -Dm644 io.github.TypicalZedF.ImmichDesktop.desktop /app/share/applications/io.github.TypicalZedF.ImmichDesktop.desktop
      - install -Dm644 io.github.TypicalZedF.ImmichDesktop.metainfo.xml /app/share/metainfo/io.github.TypicalZedF.ImmichDesktop.metainfo.xml
    sources:
      - type: dir
        path: ../../artifacts/publish/linux-x64
        dest: app
      - type: file
        path: immich-desktop.sh
      - type: file
        path: io.github.TypicalZedF.ImmichDesktop.desktop
      - type: file
        path: io.github.TypicalZedF.ImmichDesktop.metainfo.xml
      - type: file
        path: ../../src/ImmichDesktop.App/Assets/logo-512.png
      - type: file
        path: ../../src/ImmichDesktop.App/Assets/logo-256.png
