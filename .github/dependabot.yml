# Monthly update PRs for NuGet packages and GitHub Actions, one PR each, against main.
# Merging one only runs CI on main; it ships with the next release (no beta, no release by itself).
# Major versions are left for us to do by hand: they need code changes (Avalonia stays on 11.x because
# Material.Icons.Avalonia 2.4.1 is the last build for it; SkiaSharp must match Avalonia; xunit majors change the test API).
# Security fixes still arrive straight away (Dependabot security updates, any version).
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Avalonia stays on 11.x (listed on its own as well, since its version is shared through a property).
      - dependency-name: "Avalonia*"
        update-types: ["version-update:semver-major"]
      # Pinned: newer builds need Avalonia 12.
      - dependency-name: "Material.Icons.Avalonia"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
