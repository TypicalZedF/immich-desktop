# Weekly update PRs for NuGet packages and GitHub Actions, grouped so there are only a few.
# Avalonia stays on 11.x (Material.Icons.Avalonia 2.4.1 is the last build for it).
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    target-branch: beta
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      - dependency-name: "Avalonia*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Material.Icons.Avalonia"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: beta
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
