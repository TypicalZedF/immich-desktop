# Every push / pull request: tests, a Linux build, and a Windows installer that is
# actually installed and uninstalled to prove it works. The installer is attached to the run.
name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or PR replaces the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Test and build installer
        shell: pwsh
        run: ./build/publish.ps1 -Version "0.0.${{ github.run_number }}"

      - name: Smoke test - silent install, launch, uninstall
        shell: pwsh
        run: ./build/smoke-test.ps1

      - name: UI checks - render every screen against a demo server
        # The harness drives the real pages headlessly and fails on broken behaviour (grouping, Select all, …).
        shell: pwsh
        run: dotnet run --project tools/ImmichSplash.DevTools -c Release -- screens artifacts/screens

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/installer/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: artifacts/screens/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build and test (Linux)
        run: |
          dotnet build ImmichSplash.slnx -c Release
          dotnet test tests/ImmichSplash.Core.Tests -c Release --no-build
