# Builds the Windows installer and the Linux tarball and publishes a GitHub Release.
#
# To ship a new stable version:
#   git tag v1.2.0
#   git push origin v1.2.0
# ...or run it by hand from the Actions tab ("Run workflow") and type a version.
#
# Betas: every push to the `beta` branch publishes a pre-release named after the next version,
# e.g. v1.2.1-beta.57 after v1.2.0. A tag with a suffix (v1.3.0-beta.1) is published as a beta too.
# Only one beta is kept: publishing a beta removes older ones. A stable release removes every beta
# release and the beta branch too (when everything on it is in the release), so only main is left.
#
# Installed copies check for updates: the Stable channel sees only the latest stable release,
# the Beta channel (Settings → Updates) also sees pre-releases.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [beta]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.0)"
        required: true

# Read-only by default; only the job that publishes gets write access.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to number betas after the latest stable version

      - name: Work out the version
        id: v
        shell: pwsh
        run: |
          $skip = "false"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            # Push to the beta branch: next patch after the latest stable release, numbered by run.
            $stable = git tag --list "v*" | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              Sort-Object { [version]$_.TrimStart("v") } | Select-Object -Last 1
            if (-not $stable) { $stable = "v0.0.0" }
            $v = [version]$stable.TrimStart("v")
            $version = "{0}.{1}.{2}-beta.{3}" -f $v.Major, $v.Minor, ($v.Build + 1), "${{ github.run_number }}"
            # Nothing new if the beta branch is exactly a stable release (e.g. right after creating it).
            if (git tag --points-at HEAD | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' }) { $skip = "true" }
          }
          $prerelease = if ($version.Contains("-")) { "true" } else { "false" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "skip=$skip" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version (beta: $prerelease, skip: $skip)"

  linux:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test and build tarball
        run: bash ./build/publish.sh "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/installer/ImmichSplash-linux-x64.tar.gz

  windows:
    needs: [version, linux]
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to tell whether the beta branch is fully in a stable release

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Test and build installer
        shell: pwsh
        run: ./build/publish.ps1 -Version $env:VERSION

      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts/installer

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @"
          ## Install
          Download **ImmichSplash-Setup.exe** below and run it. Already installed? The app updates itself.

          Prefer no install? Use **ImmichSplash-Portable.zip**.

          **Linux:** download **ImmichSplash-linux-x64.tar.gz**, extract it and run install.sh inside.
          "@
          $extra = @()
          if ($env:PRERELEASE -eq "true") {
            $notes = "**Beta.** Installed copies on the Beta update channel (Settings → Updates) get this automatically.`n`n" + $notes
            $extra = @("--prerelease", "--target", "${{ github.sha }}")
          }
          gh release create "v$env:VERSION" `
            artifacts/installer/ImmichSplash-Setup.exe `
            artifacts/installer/ImmichSplash-Portable.zip `
            artifacts/installer/ImmichSplash-linux-x64.tar.gz `
            --title "Immich Splash $env:VERSION" `
            --notes $notes `
            --generate-notes @extra

      - name: Keep only the newest beta
        # A new beta replaces older betas; a stable release replaces every beta (it's newer than all of them).
        # Beta-channel installs always look for the newest release, so nothing they need is removed.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $current = "v$env:VERSION"
          $betas = gh release list --limit 200 --json tagName,isPrerelease | ConvertFrom-Json |
            Where-Object { $_.isPrerelease -and $_.tagName -ne $current }
          foreach ($beta in $betas) {
            Write-Host "Removing older beta $($beta.tagName)"
            gh release delete $beta.tagName --cleanup-tag --yes
          }

      - name: Remove the beta branch (stable releases)
        # Everything on beta is in this release, so the branch goes; ./build/beta.ps1 starts a new one from the
        # next beta. If beta has commits that aren't released, it stays (with a warning) so nothing is lost.
        if: env.PRERELEASE != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          git fetch --quiet origin beta 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "No beta branch"; exit 0 }
          git merge-base --is-ancestor FETCH_HEAD HEAD
          if ($LASTEXITCODE -eq 0) {
            git push --quiet origin --delete beta
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Couldn't remove the beta branch" } else { Write-Host "Removed the beta branch" }
          } else {
            Write-Host "::warning::beta has commits that aren't in this release, so it was kept"
          }
          exit 0
