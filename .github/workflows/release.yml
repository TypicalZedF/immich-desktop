# Builds the Windows installer and publishes it as a GitHub Release.
#
# To ship a new version:
#   git tag v1.0.1
#   git push origin v1.0.1
# ...or run it by hand from the Actions tab ("Run workflow") and type a version.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Work out the version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Fetch previous release (enables small delta updates)
        shell: pwsh
        continue-on-error: true
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" -o artifacts/releases/win-x64

      - name: Test, build and package
        shell: pwsh
        run: ./build/publish.ps1 -Version $env:VERSION

      - name: Publish GitHub release
        shell: pwsh
        run: >
          vpk upload github
          --repoUrl "https://github.com/${{ github.repository }}"
          --token "${{ secrets.GITHUB_TOKEN }}"
          -o artifacts/releases/win-x64
          --publish
          --releaseName "Immich Desktop $env:VERSION"
          --tag "v$env:VERSION"
