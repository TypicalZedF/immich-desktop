# Builds the Windows installer and publishes a GitHub Release.
#
# To ship a new version:
#   git tag v1.2.0
#   git push origin v1.2.0
# ...or run it by hand from the Actions tab ("Run workflow") and type a version.
#
# Installed copies of the app check this repository's latest release for updates.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Work out the version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Test and build installer
        shell: pwsh
        run: ./build/publish.ps1 -Version $env:VERSION

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @"
          ## Install
          Download **ImmichDesktop-Setup.exe** below and run it. Already installed? The app updates itself.

          Prefer no install? Use **ImmichDesktop-Portable.zip**.
          "@
          gh release create "v$env:VERSION" `
            artifacts/installer/ImmichDesktop-Setup.exe `
            artifacts/installer/ImmichDesktop-Portable.zip `
            --title "Immich Desktop $env:VERSION" `
            --notes $notes `
            --generate-notes
